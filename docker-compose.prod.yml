# ================================
# AI照项目 - 生产环境部署
# ================================
# 艹！Nginx + Let's Encrypt SSL + 前后端服务
#
# 使用方法:
# 1. 先配置域名DNS A记录指向服务器IP
# 2. 修改下面的环境变量（域名、邮箱等）
# 3. docker-compose -f docker-compose.prod.yml up -d

services:
  # ========== Nginx反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: ai-photo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro  # 艹！Let's Encrypt验证目录
    depends_on:
      - backend
      - frontend
    networks:
      - ai-photo-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== Certbot SSL证书自动化 ==========
  certbot:
    image: certbot/certbot:latest
    container_name: ai-photo-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # 艹！自动申请和续期证书
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - ai-photo-network

  # ========== 后端服务 ==========
  backend:
    image: ghcr.io/lpding888/aiygw4.0/backend:latest
    container_name: ai-photo-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # ========== 数据库配置 ==========
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-prod_user}
      DB_PASSWORD: ${DB_PASSWORD}  # 艹！必须在.env文件中设置
      DB_NAME: ${DB_NAME:-ai_photo}
      # ========== Redis配置 ==========
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}  # 艹！必须设置Redis密码
      # ========== JWT密钥 ==========
      JWT_SECRET: ${JWT_SECRET}  # 艹！生产环境必须用强密钥
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # ========== 加密密钥 ==========
      MASTER_KEY: ${MASTER_KEY}
      ENCRYPTION_KEY_V1: ${ENCRYPTION_KEY_V1}
      ENCRYPTION_KEY_V2: ${ENCRYPTION_KEY_V2}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      # ========== 腾讯云COS配置 ==========
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_BUCKET: ${COS_BUCKET}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_CDN_DOMAIN: ${COS_CDN_DOMAIN}
      COS_IMAGE_DOMAIN: ${COS_IMAGE_DOMAIN}
      # ========== 微信支付配置 ==========
      WECHAT_APPID: ${WECHAT_APPID}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_MCHID: ${WECHAT_MCHID}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY}
      WECHAT_SERIAL_NO: ${WECHAT_SERIAL_NO}
      WECHAT_MERCHANT_SERIAL_NO: ${WECHAT_MERCHANT_SERIAL_NO}
      WECHAT_PUBLIC_KEY: ${WECHAT_PUBLIC_KEY}
      WECHAT_CERT_PATH: ${WECHAT_CERT_PATH}
      WECHAT_KEY_PATH: ${WECHAT_KEY_PATH}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL}
      WECHAT_RETURN_URL: ${WECHAT_RETURN_URL}
      # ========== SMTP配置 ==========
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI衣柜}
      # ========== 前端URL ==========
      FRONTEND_URL: ${FRONTEND_URL}
      # ========== AI服务配置 ==========
      RUNNING_HUB_API_KEY: ${RUNNING_HUB_API_KEY}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY}
      KUAI_API_KEY: ${KUAI_API_KEY}
      # ========== 支付宝配置 ==========
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      # ========== BullMQ配置 ==========
      REDIS_BULLMQ_DB: ${REDIS_BULLMQ_DB:-2}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-ai_photo}
      # ========== 日志配置 ==========
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    volumes:
      - backend-logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - ai-photo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 艹！资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ========== 前端服务 ==========
  frontend:
    image: ghcr.io/lpding888/aiygw4.0/frontend:latest
    container_name: ai-photo-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: https://api.aizhao.icu/api  # 艹！修改为你的API域名
      NEXT_PUBLIC_API_URL: https://api.aizhao.icu/api
      NEXT_PUBLIC_API_BASE_URL: https://api.aizhao.icu/api
      NEXT_PUBLIC_WS_URL: wss://api.aizhao.icu
    networks:
      - ai-photo-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ========== MySQL 8.4 LTS 数据库 ==========
  mysql:
    image: mysql:8.4
    container_name: ai-photo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ai_photo
      MYSQL_USER: ${DB_USER:-aiuser}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    entrypoint: ["sh", "-c", "mkdir -p /var/log/mysql && chown mysql:mysql /var/log/mysql && exec mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=200 --innodb-buffer-pool-size=512M --datadir=/var/lib/mysql --user=mysql"]
    command: []
    networks:
      - ai-photo-network

  # ========== Redis 7.0 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: ai-photo-redis
    restart: always
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - ai-photo-network
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--raw",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Prometheus 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-photo-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - ai-photo-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== Grafana 可视化 ==========
  grafana:
    image: grafana/grafana:latest
    container_name: ai-photo-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ai-photo-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ========== 网络配置 ==========
networks:
  ai-photo-network:
    driver: bridge

# ========== 数据卷 ==========
volumes:
  mysql-data:
    external: true
    name: fashion-ai-saas_mysql-data
  redis-data:
    driver: local
  backend-logs:
    driver: local
  certbot-webroot:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
